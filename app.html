function compressImageForUpload(file) {
  return new Promise(function(resolve) {
    if (!file || !file.type || file.type.indexOf("image/") !== 0) { resolve(file); return; }
    if (file.type === "image/gif") { resolve(file); return; }
    var SKIP_BELOW = 150 * 1024;
    if (file.size <= SKIP_BELOW) { resolve(file); return; }
    if (!window.URL || !window.URL.createObjectURL || !document.createElement("canvas").getContext) { resolve(file); return; }
    var img = new Image();
    var objectUrl = URL.createObjectURL(file);
    var settled = false;
    var finish = function(result) {
      if (settled) return;
      settled = true;
      URL.revokeObjectURL(objectUrl);
      resolve(result);
    };
    img.onload = function() {
      try {
        var MAX_DIM = 1000;
        var w = img.naturalWidth || img.width;
        var h = img.naturalHeight || img.height;
        if (!w || !h) { finish(file); return; }
        if (w > MAX_DIM || h > MAX_DIM) {
          if (w > h) { h = Math.round(h * (MAX_DIM / w)); w = MAX_DIM; }
          else { w = Math.round(w * (MAX_DIM / h)); h = MAX_DIM; }
        }
        var canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(blob) {
          if (!blob || blob.size >= file.size) { finish(file); return; }
          var compressedFile;
          try {
            compressedFile = new File([blob], file.name, { type: "image/jpeg", lastModified: Date.now() });
          } catch (e) {
            compressedFile = blob;
          }
          finish(compressedFile);
        }, "image/jpeg", 0.7);
      } catch (e) {
        finish(file);
      }
    };
    img.onerror = function() { finish(file); };
    img.src = objectUrl;
  });
}
window.uploadToCloudinary = function(file, onProgress) {
  return compressImageForUpload(file).then(function(processedFile) {
    return uploadToCloudinaryRaw(processedFile, onProgress);
  }).catch(function() {
    return uploadToCloudinaryRaw(file, onProgress);
  });
};
function uploadToCloudinaryRaw(file, onProgress) {
  var isVideo = file.type.startsWith("video/");
  var isImage = file.type.startsWith("image/");
  var MB = 1024 * 1024;
  if (isVideo && file.size > 30 * MB) return Promise.reject(new Error("VIDEO_TOO_LARGE"));
  if (isImage && file.size > 5 * MB)   return Promise.reject(new Error("IMAGE_TOO_LARGE"));
  if (!isVideo && !isImage && file.size > 10 * MB) return Promise.reject(new Error("FILE_TOO_LARGE"));
  var apiUrl = "https://api.cloudinary.com/v1_1/" + window.CLOUDINARY_CLOUD + "/auto/upload";
  var MAX_ATTEMPTS = 3;
  window._ssShowUploadToast(0, file.name);
  function attemptUpload(attempt) {
    return new Promise(function(resolve, reject) {
    var formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", window.CLOUDINARY_PRESET);
    var xhr = new XMLHttpRequest();
    xhr.open("POST", apiUrl);
    xhr.upload.onprogress = function(e) {
    if (e.lengthComputable) {
    var pct = Math.round((e.loaded / e.total) * 100);
    window._ssShowUploadToast(pct, file.name);
    if (onProgress) onProgress(pct);
    }
    };
    xhr.onload = function() {
    try {
    var res = JSON.parse(xhr.responseText);
    if (res.secure_url) {
    resolve(res.secure_url);
    } else {
    reject(new Error((res.error && res.error.message) || "Upload failed"));
    }
    } catch(e) {
    reject(new Error("Invalid server response"));
    }
    };
    xhr.onerror = function() { reject(new Error("Network error")); };
    xhr.ontimeout = function() { reject(new Error("Timeout")); };
    xhr.timeout = 60000;
    xhr.send(formData);
    });
  }
  function tryWithRetry(attempt) {
    return attemptUpload(attempt).then(function(url) {
    window._ssHideUploadToast(true);
    return url;
    }).catch(function(err) {
    if (attempt < MAX_ATTEMPTS) {
    var retryLabel = document.getElementById("ss-ut-label");
    if (retryLabel) retryLabel.textContent = "🔄 Retry " + attempt + "/" + (MAX_ATTEMPTS-1) + "...";
    return new Promise(function(res) { setTimeout(res, 1500); }).then(function() {
    return tryWithRetry(attempt + 1);
    });
    }
    window._ssHideUploadToast(false, "Upload failed. Check internet & try again.");
    return Promise.reject(err);
    });
  }
  return tryWithRetry(1);
};
